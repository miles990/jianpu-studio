name: Test and build Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Qt test system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - run: pip install -e '.[dev]'
      - run: python scripts/fetch_runtime.py --platform linux
      - run: ruff check src tests scripts
      - run: python scripts/check_version.py
      - run: python scripts/render_docs.py --check
      - run: pytest -q --junitxml=work/tests.xml
        env:
          QT_QPA_PLATFORM: offscreen
          JIANPU_LILYPOND: ${{ github.workspace }}/vendor-runtime/lilypond/bin/lilypond
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-results
          path: work/tests.xml

  windows:
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      BUILD_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python scripts/fetch_runtime.py --platform windows
      - name: Test on Windows with real LilyPond
        run: |
          $env:JIANPU_LILYPOND = "$pwd/vendor-runtime/lilypond/bin/lilypond.exe"
          $env:QT_QPA_PLATFORM = "offscreen"
          pytest -q --junitxml=work/windows-tests.xml
      - run: pyinstaller --noconfirm packaging/JianpuStudio.spec
        if: env.BUILD_RELEASE == 'true'
      - run: python scripts/assemble.py
        if: env.BUILD_RELEASE == 'true'
      - name: Test bundled engines and photo recognition
        if: env.BUILD_RELEASE == 'true'
        run: python scripts/smoke_bundle.py dist/JianpuStudio --omr
      - name: Build one-step installer
        if: env.BUILD_RELEASE == 'true'
        run: |
          $iscc = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          & $iscc packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify unattended install and uninstall
        if: env.BUILD_RELEASE == 'true'
        timeout-minutes: 5
        run: |
          $installer = (Get-ChildItem dist/*-Setup.exe)[0].FullName
          $target = "$env:RUNNER_TEMP/中文資料夾/簡譜工房"
          $p = Start-Process -FilePath $installer -ArgumentList '/CURRENTUSER', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$target`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          python scripts/smoke_bundle.py "$target" --omr
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $p = Start-Process -FilePath "$target/unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstaller failed: $($p.ExitCode)" }
      - name: Verify protected-folder guidance and administrator installation
        if: env.BUILD_RELEASE == 'true'
        timeout-minutes: 5
        run: |
          $installer = (Get-ChildItem dist/*-Setup.exe)[0].FullName
          $target = "$env:ProgramFiles/JianpuStudio-PermissionTest"
          $p = Start-Process -FilePath $installer -ArgumentList '/CURRENTUSER', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$target`"" -Wait -PassThru
          if ($p.ExitCode -eq 0 -or (Test-Path $target)) { throw "Per-user install must reject Program Files before copying" }
          $p = Start-Process -FilePath $installer -ArgumentList '/ALLUSERS', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$target`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "All-users installer failed: $($p.ExitCode)" }
          python scripts/smoke_bundle.py "$target"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $p = Start-Process -FilePath "$target/unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "All-users uninstaller failed: $($p.ExitCode)" }
      - name: Verify upgrade preserves projects, settings, path and restart
        if: env.BUILD_RELEASE == 'true'
        timeout-minutes: 6
        run: |
          $old = "$env:RUNNER_TEMP/JianpuStudio-old.exe"
          Invoke-WebRequest 'https://github.com/miles990/jianpu-studio/releases/download/v0.2.1/JianpuStudio-0.2.1-Windows-x64-Setup.exe' -OutFile $old
          $target = "$env:RUNNER_TEMP/升級測試/簡譜 工房"
          $p = Start-Process $old -ArgumentList '/CURRENTUSER', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$target`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Baseline installation failed" }
          Copy-Item examples/twinkle.jps "$target/我的樂譜.jps"
          $before = (Get-FileHash "$target/我的樂譜.jps").Hash
          $settings = 'HKCU:\Software\JianpuStudio\JianpuStudio'
          New-Item $settings -Force | Out-Null
          New-ItemProperty $settings -Name UpgradeSentinel -Value 'keep-me' -Force | Out-Null
          $installer = (Get-ChildItem dist/*-Setup.exe)[0].FullName
          $p = Start-Process $installer -ArgumentList '/CURRENTUSER', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/JIANPURESTART=1', "/DIR=`"$target`"" -PassThru
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { throw "Upgrade failed: $($p.ExitCode)" }
          $restarted = $null
          for ($i=0; $i -lt 30; $i++) {
            $restarted = Get-Process JianpuStudio -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq "$target/JianpuStudio.exe" -or $_.Path -eq "$($target.Replace('/', '\'))\JianpuStudio.exe" }
            if ($restarted) { break }
            Start-Sleep -Seconds 1
          }
          if (-not $restarted) { throw 'Updated application did not restart' }
          $restarted | Stop-Process -Force
          if ((Get-FileHash "$target/我的樂譜.jps").Hash -ne $before) { throw 'User project changed during upgrade' }
          if ((Get-ItemProperty $settings).UpgradeSentinel -ne 'keep-me') { throw 'Settings lost during upgrade' }
          # A windowed executable does not reliably set PowerShell's LASTEXITCODE.
          # The Python subprocess waits for its actual exit (as smoke_bundle.py does).
          $diagnostics = "$pwd/work/upgrade-diagnostics"
          python -c "import subprocess,sys; sys.exit(subprocess.call(sys.argv[1:], timeout=110))" "$target/JianpuStudio.exe" --self-test "$diagnostics"
          if ($LASTEXITCODE -ne 0) { throw "Updated GUI smoke failed: $LASTEXITCODE" }
          $detected = Get-Content "$diagnostics/update-target.json" | ConvertFrom-Json
          if ($detected.scope -ne 'CURRENTUSER') { throw 'Updater failed to detect original installation scope' }
          if ([IO.Path]::GetFullPath($detected.directory) -ne [IO.Path]::GetFullPath($target)) { throw 'Updater failed to preserve custom path' }
          $p = Start-Process "$target/unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Updated uninstaller failed' }
          Remove-ItemProperty $settings -Name UpgradeSentinel
      - name: Portable archive and checksums
        if: env.BUILD_RELEASE == 'true'
        run: |
          $appVersion = python -c "from jianpu_studio import __version__; print(__version__)"
          7z a -tzip "dist/JianpuStudio-$appVersion-Windows-x64-Portable.zip" ./dist/JianpuStudio/*
          Get-ChildItem dist/*-Setup.exe, dist/*-Portable.zip | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: env.BUILD_RELEASE == 'true'
        with:
          name: JianpuStudio-Windows-x64
          path: |
            dist/*-Setup.exe
            dist/*-Portable.zip
            dist/SHA256SUMS.txt
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-diagnostics
          path: |
            work/windows-tests.xml
            work/msi-extract.log
            work/bundle-diagnostics/*
            work/upgrade-diagnostics/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: JianpuStudio-Windows-x64
          path: release
      - name: Publish tested Windows packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "簡譜工房 $GITHUB_REF_NAME" --notes-file docs/release-notes.md --verify-tag
