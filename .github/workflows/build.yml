name: Test and build Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Qt test system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - run: pip install -e '.[dev]'
      - run: python scripts/fetch_runtime.py --platform linux
      - run: ruff check src tests scripts
      - run: pytest -q --junitxml=work/tests.xml
        env:
          QT_QPA_PLATFORM: offscreen
          JIANPU_LILYPOND: ${{ github.workspace }}/vendor-runtime/lilypond/bin/lilypond
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-results
          path: work/tests.xml

  windows:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python scripts/fetch_runtime.py --platform windows
      - name: Test on Windows with real LilyPond
        run: |
          $env:JIANPU_LILYPOND = "$pwd/vendor-runtime/lilypond/bin/lilypond.exe"
          $env:QT_QPA_PLATFORM = "offscreen"
          pytest -q --junitxml=work/windows-tests.xml
      - run: pyinstaller --noconfirm packaging/JianpuStudio.spec
      - run: python scripts/assemble.py
      - name: Test bundled engines and photo recognition
        run: python scripts/smoke_bundle.py dist/JianpuStudio --omr
      - name: Build one-step installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          & $iscc packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify unattended install and uninstall
        run: |
          $installer = (Get-ChildItem dist/*-Setup.exe)[0].FullName
          $target = "$env:RUNNER_TEMP/Installed Jianpu"
          $p = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$target`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          python scripts/smoke_bundle.py "$target"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $p = Start-Process -FilePath "$target/unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstaller failed: $($p.ExitCode)" }
      - name: Portable archive and checksums
        run: |
          7z a -tzip dist/JianpuStudio-0.1.0-Windows-x64-Portable.zip ./dist/JianpuStudio/*
          Get-ChildItem dist/*-Setup.exe, dist/*-Portable.zip | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: JianpuStudio-Windows-x64
          path: |
            dist/*-Setup.exe
            dist/*-Portable.zip
            dist/SHA256SUMS.txt
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-diagnostics
          path: |
            work/windows-tests.xml
            work/msi-extract.log

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: JianpuStudio-Windows-x64
          path: release
      - name: Publish tested Windows packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "簡譜工房 $GITHUB_REF_NAME" --notes-file docs/release-notes.md --verify-tag
