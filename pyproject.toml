[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jianpu-studio"
version = "0.2.1"
description = "簡譜工房 — approachable offline numbered-notation desktop editor"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Jianpu Studio contributors"}]
dependencies = ["PySide6==6.8.3", "Pillow==11.3.0", "defusedxml==0.7.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-qt==4.5.0", "ruff==0.14.5", "pyinstaller==6.16.0"]

[project.scripts]
jianpu-studio = "jianpu_studio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jianpu_studio = ["vendor/LICENSE*", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = ["integration: requires a real LilyPond executable", "omr: requires Audiveris"]

[tool.ruff]
line-length = 110
exclude = ["src/jianpu_studio/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
